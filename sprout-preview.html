<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Sprout’s porch · Art study</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #e8e8d6;
        color: #304b42;
        font-family: system-ui, sans-serif;
        height: 100dvh;
        overflow: hidden;
        display: grid;
        grid-template-rows: auto 1fr auto;
      }
      header {
        padding: 22px 26px 4px;
        pointer-events: none;
      }
      small {
        font-size: 11px;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      h1 {
        font-family: Georgia, serif;
        font-size: clamp(27px, 5vw, 44px);
        margin: 7px 0;
      }
      p {
        font-size: 14px;
        margin: 5px 0;
        color: #52685b;
      }
      #view {
        min-height: 0;
        position: relative;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      footer {
        padding: 8px 20px max(16px, env(safe-area-inset-bottom));
        display: flex;
        justify-content: center;
        gap: 12px;
      }
      button {
        border: 1px solid #b3c5aa;
        border-radius: 24px;
        background: #fff9e9;
        color: #304b42;
        min-height: 100px;
        min-width: 115px;
        padding: 12px 24px;
        cursor: pointer;
        font: 600 14px system-ui;
        box-shadow: 0 5px 0 #c5cfb6;
      }
      button:active {
        transform: translateY(3px);
        box-shadow: 0 2px 0 #c5cfb6;
      }
      button:focus-visible {
        outline: 3px solid #218777;
        outline-offset: 3px;
      }
      button:disabled {
        opacity: 0.5;
      }
      button span {
        display: block;
        font-size: 26px;
        margin-bottom: 7px;
      }
      #status {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        text-align: center;
        pointer-events: none;
        font-size: 13px;
      }
      @media (max-height: 500px) {
        header {
          position: absolute;
          z-index: 1;
          padding: 12px 20px;
        }
        header p {
          display: none;
        }
        h1 {
          font-size: 26px;
        }
        body {
          grid-template-rows: 1fr;
        }
        footer {
          position: absolute;
          right: 8px;
          bottom: 8px;
          flex-direction: column;
          padding: 0;
        }
        button {
          min-width: 105px;
          padding: 8px;
        }
        #view {
          height: 100dvh;
        }
        #status {
          text-align: left;
          padding: 12px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <small>Puddle Island · 3D art study 01</small>
      <h1>Sprout’s porch</h1>
      <p>A little hello. A little play.</p>
    </header>
    <main id="view"><div id="status" role="status">Getting the porch ready…</div></main>
    <footer>
      <button id="wave" disabled><span aria-hidden="true">✋</span>Say hello</button
      ><button id="ball" disabled><span aria-hidden="true">●</span>Roll the ball</button>
    </footer>
    <script type="module" src="/src/dev/sprout-preview.ts"></script>
  </body>
</html>
