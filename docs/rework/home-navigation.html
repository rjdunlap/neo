<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RW03 · Home and navigation wireframe</title>
<style>
:root{font:20px system-ui;color:#2b2b3a;background:#fff4e3}*{box-sizing:border-box}body{margin:0}header,footer{padding:12px 24px;background:#ecd2b8}header{display:flex;gap:14px;align-items:center;flex-wrap:wrap}select{font:inherit;padding:10px}main{max-width:1100px;margin:auto;padding:20px}h1{margin:10px 0}.nav,.cards{display:flex;gap:16px;flex-wrap:wrap;margin:16px 0}button{font:inherit;color:inherit;border:3px solid #3a9a9b;background:#bff0ec;border-radius:24px;min-height:104px;min-width:104px;padding:14px;cursor:pointer}button:active{transform:scale(.96);background:#ffdd82}button:focus-visible{outline:5px solid #6c45c4;outline-offset:3px}.card{flex:1 1 200px;max-width:350px;min-height:166px;background:#cde6ff;border-color:#2f78c9}.icon{display:block;font-size:48px;line-height:1.2}.creature{background:#d6f5c8;border-color:#4a9a35}.scene{background:#fff;border:3px solid #8f6142;border-radius:32px;padding:18px;min-height:340px}#caption{padding:12px;background:#fff0b3;border-radius:16px;min-height:55px}small{font-size:15px}footer{margin-top:20px}#state{font:15px ui-monospace;overflow-wrap:anywhere}@media(max-width:800px){.card{flex-basis:40%;max-width:none}main{padding:16px}}
</style>
<header><strong>RW03 • route wireframe</strong><label>Review preset <select id="band"><option>lap</option><option>toddler</option><option selected>school</option></select></label><small>Sample state only · no real save or game</small></header>
<main><div class="nav" id="nav"></div><section class="scene"><h1 id="title"></h1><div id="cards" class="cards"></div></section><p id="caption" aria-live="polite"></p><button id="speak" aria-label="Hear this screen again">◖)) Hear again</button><p id="state"></p></main>
<footer>Provisional names and drawn symbols. Production needs Pixi art, recorded voice lines, input guards and real route tests. <a href="HOME-NAVIGATION.md">Read the packet</a>.</footer>
<script>
const $=id=>document.getElementById(id);
let screen='home', trail=[], person='A', selected='Sprout', inspected='Sprout', worn=false, project=0, origin='workshop', page=0, suggestion=1;
const games=['Bubble Pop','Sing-Along Barn','Fill and Dump','Song Maker','Stamp Studio','Pet Kitchen','Letter Trails','Robot Path'];
const icons=['◯','♫','▱','♬','✿','◴','✎','⚙'];
const young=()=>$('band').value!=='school';
function say(text){$('caption').textContent=text;if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);speechSynthesis.speak(u)}}
function button(label,icon,action,kind='card'){let b=document.createElement('button');b.className=kind;let i=document.createElement('span');i.className='icon';i.textContent=icon;b.append(i,document.createTextNode(label));b.onclick=action;$('cards').append(b)}
function go(next){trail.push(screen);screen=next;render()}
function home(){screen='home';trail=[];render()}
function back(){if(['intro','round','result'].includes(screen)){screen=origin;trail=['home',...(origin==='project'?[]:['explore'])]}else screen=trail.pop()||'home';render()}
function render(){
 $('cards').replaceChildren();$('nav').replaceChildren();
 for(const [label,fn]of [['⌂ Home',home],...(screen!=='home'?[['↶ Back',back]]:[]),['♙ Who’s playing',()=>go('chooser')]]){let b=document.createElement('button');b.textContent=label;b.onclick=fn;$('nav').append(b)}
 let title='',cue='';
 if(screen==='home'){title=`${person}’s home`;cue=young()?'Play with your friend, or explore.':project===0?'Make a welcome for a new friend. Or play and explore.':'Your project is waiting where you left it.';
 if(!young())button(project===0?'Welcome a friend':project===2?'Visit your welcome':'Continue welcome','✉',()=>go('project'));
 button(`${selected}${worn?' • crown':''} · play`,'♧',()=>go('play'),'card creature');button('Explore','⌕',()=>go('explore'))}
 if(screen==='play'){title=`Play with ${selected}`;cue='Tap the ball to play again. The basket holds your friends and clothes.';button('Roll the ball','●',()=>say(`${selected} rolls it back! Play again whenever you like.`));button('Friends and clothes','▤',()=>go('collection'));button('Your kept picture','✿',()=>go('library'))}
 if(screen==='collection'){title='Your friends';cue='Choose a friend to look at. Then ask them to come with you.';['Sprout','River','Glider'].forEach((name,i)=>button(name,['♧','∿','☁'][i],()=>{inspected=name;render();say(`Looking at ${name}. Choose Come with me to travel together.`)}));button('Come with me','➜',()=>{selected=inspected;go('play');say(`${selected} comes with you.`)});button('Dress this friend','♕',()=>go('dress'))}
 if(screen==='dress'){title=`Dress ${inspected}`;cue='Choose the crown, or take it off. It stays yours.';button(worn?'Take crown off':'Wear crown','♕',()=>{worn=!worn;render()})}
 if(screen==='explore'){title='Explore';cue='Choose a place, a favorite, all games, or family play.';[['Places','⌖','places'],['Favorites · all ages','♥','favorites'],['All games','▦','index'],['Family play','⌘','couch']].forEach(([a,b,c])=>button(a,b,()=>go(c)))}
 if(screen==='places'){title='Places · sample shelf';cue='Visit the music workshop. More places use pages, with the same large pictures.';button('Music workshop','♫',()=>go('workshop'));button('Discovery library','▤',()=>go('library'))}
 if(screen==='workshop'){title='Music workshop';cue='Make a tune, or sing along.';['Song Maker','Sing-Along Barn'].forEach(name=>button(name,'♫',()=>launch(name)))}
 if(screen==='library'){title='Discovery library';cue='Your kept picture lives here. Open its game to make another.';button('Picture · make another','✿',()=>launch('Stamp Studio'));button('Windy Picnic · existing story','☂',()=>say('Existing story entry. Its own completed steps remain separate from Welcome.'))}
 if(screen==='favorites'){title='Favorites · other ages stay reachable';cue='Bubble Pop is your younger favorite. This sample uses lap play.';button('Bubble Pop · lap','♥',()=>launch('Bubble Pop'))}
 if(screen==='index'){title=`All games · sample page ${page+1} of 2`;cue='This is a sample index. Production lists every registration, with other ages and input labels.';games.slice(page*4,page*4+4).forEach(name=>button(name,icons[games.indexOf(name)],()=>launch(name)));button(page?'Previous page':'Next page',page?'←':'→',()=>{page=1-page;render()})}
 if(screen==='intro'){title=`${window.currentGame} · how to`;cue='This stands for the normal level-specific how-to card and demo. The round has not started.';button('Play','▶',()=>go('round'))}
 if(screen==='round'){title=`${window.currentGame} · pretend round`;cue='Finish the sample round, or leave it unfinished. Production plays the real game.';button('Finish sample','✓',()=>{if(origin==='project'){project=2;screen='ending';trail=['home','project']}else{screen='result';trail=[origin]}render()});button('Pause / leave unfinished','Ⅱ',()=>{screen=origin;trail=origin==='project'?['home']:['home','explore'];render();say('Unfinished round left. Completed project steps stay done.')})}
 if(screen==='result'){title='Round complete · sample sticker';cue='Again repeats this level. Next level stays in this game. Back returns to where you started.';button('Again','↻',()=>go('intro'));button('Next level','↑',()=>go('intro'));if(young()&&games.slice(0,3).includes(window.currentGame)){button(`Next game · ${games[suggestion]}`,icons[suggestion],()=>{window.currentGame=games[suggestion];screen='intro';trail=[origin];render()});button('Another game','⇄',()=>{suggestion=(suggestion+1)%3;if(games[suggestion]===window.currentGame)suggestion=(suggestion+1)%3;render()})}}
 if(screen==='project'){title='Welcome a friend · sample project';cue=project===2?'Your welcome is complete. Visit your new friend.':'The next unfinished step starts fresh. The exact project comes from RW04.';button(project===2?'See welcome':'Continue next step','✉',()=>{if(project===2)go('ending');else{project=1;launch('Welcome task placeholder')}});button('Play freely instead','⌕',()=>go('explore'))}
 if(screen==='ending'){title='Welcome complete · sample consequence';cue='The new friend uses your picture. Production must use an actual reported creation and apply adoption only once.';button('Go home','⌂',home)}
 if(screen==='chooser'){title='Who’s playing?';cue='Switching person clears the visit context. The sample resets instead of reading real profiles.';button(`Switch to ${person==='A'?'B':'A'}`,'♙',()=>{person=person==='A'?'B':'A';project=0;selected='Sprout';worn=false;page=0;home()});button('Enter / pad → couch','⌘',()=>go('couch'))}
 if(screen==='couch'){title='Existing couch shell · boundary';cue='Production keeps courses, controls and separate couch records. Leave returns to the caller.';button('Leave couch','↶',back)}
 $('title').textContent=title;$('caption').textContent=cue;$('state').textContent=`Review state: ${screen} | caller trail: ${trail.join(' → ')} | game origin: ${origin} | project: ${project} (0 none, 1 unfinished, 2 done)`;
}
function launch(name){window.currentGame=name;origin=screen;go('intro')}
$('band').onchange=home;$('speak').onclick=()=>say($('caption').textContent);render();
</script></html>
